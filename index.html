<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UADE · Depurador de Excels</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0f2a4a;
    --navy-dark:#0a1d33;
    --blue:#1d5fa8;
    --gold:#c9a24b;
    --bg:#f4f6f9;
    --card:#ffffff;
    --line:#e1e6ed;
    --text:#1c2733;
    --text-muted:#5b6b7d;
    --ok:#1c8a5a;
    --ok-bg:#e8f6ef;
    --warn:#b8860b;
    --warn-bg:#fbf1dc;
    --danger:#b3261e;
    --danger-bg:#fbeceb;
    --info:#1d5fa8;
    --info-bg:#e9f1fb;
    --radius:16px;
    --glass-bg:rgba(255,255,255,.62);
    --glass-bg-strong:rgba(255,255,255,.78);
    --glass-border:rgba(255,255,255,.55);
    --glass-shadow:0 8px 32px rgba(15,42,74,.10), 0 1.5px 4px rgba(15,42,74,.06);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(680px 480px at 8% -8%, rgba(29,95,168,.16), transparent 60%),
      radial-gradient(620px 460px at 108% 4%, rgba(201,162,75,.14), transparent 60%),
      radial-gradient(900px 620px at 50% 118%, rgba(15,42,74,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh;
  }
  ::selection{background:rgba(29,95,168,.22);}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }
  header.app{
    background:linear-gradient(135deg, var(--navy-dark), var(--navy) 60%, var(--blue));
    color:#fff;
    padding:22px 32px;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    overflow:hidden;
  }
  header.app::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(240px 140px at 85% -20%, rgba(201,162,75,.35), transparent 70%),
      radial-gradient(320px 200px at 10% 120%, rgba(29,95,168,.4), transparent 70%);
    pointer-events:none;
  }
  header.app > *{position:relative;}
  header.app .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 4px rgba(201,162,75,.25);
    flex:none;
  }
  header.app h1{
    font-size:18px;
    margin:0;
    font-weight:600;
    letter-spacing:.2px;
  }
  header.app p{
    margin:1px 0 0;
    font-size:12.5px;
    color:rgba(255,255,255,.72);
  }
  nav.tabs{
    position:sticky;
    top:0;
    z-index:20;
    padding:0 24px;
    display:flex;
    gap:6px;
    background:rgba(15,42,74,.82);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,.08);
    overflow-x:auto;
  }
  nav.tabs .inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    gap:6px;
    width:100%;
  }
  nav.tabs button{
    appearance:none;
    border:none;
    background:transparent;
    color:rgba(255,255,255,.65);
    padding:12px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    transition:color .2s var(--ease);
  }
  nav.tabs button:hover{color:rgba(255,255,255,.9);}
  nav.tabs button.active{
    color:#fff;
    border-bottom-color:var(--gold);
  }
  main{
    max-width:1180px;
    margin:0 auto;
    padding:24px 24px 60px;
  }
  .panel{display:none;}
  .panel.active{display:block; animation:panelIn .35s var(--ease);}
  @keyframes panelIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .card{
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow:var(--glass-shadow);
    transition:box-shadow .25s var(--ease);
  }
  .card h2{
    margin:0 0 12px;
    font-size:14px;
    font-weight:600;
    color:var(--navy);
  }
  .dropzone{
    border:2px dashed rgba(29,95,168,.28);
    border-radius:calc(var(--radius) - 2px);
    padding:28px 20px;
    text-align:center;
    cursor:pointer;
    transition:.2s var(--ease);
    background:rgba(255,255,255,.35);
  }
  .dropzone:hover{
    background:rgba(255,255,255,.55);
    border-color:rgba(29,95,168,.4);
  }
  .dropzone.drag{
    border-color:var(--blue);
    background:rgba(238,244,251,.75);
    transform:scale(1.01);
  }
  .dropzone .icon{font-size:28px; margin-bottom:6px;}
  .dropzone .main-txt{
    font-size:14px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:3px;
  }
  .dropzone .sub-txt{
    font-size:12px;
    color:var(--text-muted);
  }
  input[type=file]{display:none;}
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(180deg, #2568b8, var(--blue) 60%, #164e8c);
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
    padding:10px 18px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 4px 14px rgba(29,95,168,.28);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease), background .15s;
  }
  .btn:hover{
    background:linear-gradient(180deg, #2c72c4, #164e8c 60%, #123f70);
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 18px rgba(29,95,168,.36);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0); box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 2px 8px rgba(29,95,168,.3);}
  .err-box{
    display:none;
    background:rgba(251,236,235,.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--danger);
    border:1px solid #f3c7c3;
    padding:12px 16px;
    border-radius:10px;
    font-size:13.5px;
    margin-top:14px;
  }
  .results{display:none;}
  .sub{
    margin:0 0 14px;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px;
  }
  .stat{
    border:1px solid rgba(255,255,255,.6);
    border-radius:12px;
    padding:12px 14px;
    background:rgba(255,255,255,.5);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:transform .2s var(--ease), background .2s var(--ease);
  }
  .stat:hover{background:rgba(255,255,255,.72); transform:translateY(-1px);}
  .stat .n{font-size:22px; font-weight:700; color:var(--navy); line-height:1.1;}
  .stat .l{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
  .stat.fixed{border-color:var(--warn);}
  .stat.fixed .n{color:var(--warn);}
  .stat.aviso{border-color:var(--info);}
  .stat.aviso .n{color:var(--info);}
  .stat.anomaly{border-color:var(--danger);}
  .stat.anomaly .n{color:var(--danger);}

  .health-bar{
    display:flex;
    height:8px;
    border-radius:999px;
    overflow:hidden;
    margin:14px 0 8px;
    background:#eef1f5;
  }
  .health-seg{height:100%;}
  .seg-ok{background:var(--ok);}
  .seg-warn{background:var(--warn);}
  .seg-info{background:var(--info);}
  .seg-danger{background:var(--danger);}
  .health-legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .health-legend span{display:inline-flex; align-items:center; gap:5px;}
  .health-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .aviso-details{
    font-size:12px;
    color:var(--text-muted);
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 12px;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:background .2s var(--ease);
  }
  .aviso-details:hover{background:rgba(255,255,255,.65);}
  .aviso-details.fixed{border-color:#f0dfa8;}
  .aviso-details.aviso{border-color:#c9dcf3;}
  .aviso-details.anomaly{border-color:#f0c4c0;}
  .aviso-details summary{cursor:pointer; font-weight:600;}
  .aviso-details.fixed summary{color:var(--warn);}
  .aviso-details.aviso summary{color:var(--info);}
  .aviso-details.anomaly summary{color:var(--danger);}
  .aviso-details .ids{margin-top:6px; line-height:1.6; word-break:break-word;}

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin:16px 0 12px;
  }
  .toolbar .left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-input{
    border:1px solid rgba(29,95,168,.18);
    border-radius:10px;
    padding:9px 12px;
    font-size:13px;
    width:240px;
    max-width:55vw;
    background:rgba(255,255,255,.6);
    transition:background .2s var(--ease), border-color .2s var(--ease);
  }
  .search-input:focus{background:#fff; border-color:var(--blue);}
  .chk{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--text-muted);
    user-select:none; cursor:pointer;
  }
  .table-wrap{
    border:1px solid rgba(255,255,255,.6);
    border-radius:12px;
    overflow:auto;
    max-height:60vh;
    /* Casi opaco a propósito: el resto de la interfaz es vidrio, pero la grilla de
       datos necesita contraste sólido y confiable para que el texto se lea bien. */
    background:rgba(255,255,255,.94);
    box-shadow:var(--glass-shadow);
  }
  table{border-collapse:collapse; width:100%; font-size:12px; white-space:nowrap;}
  thead th{
    position:sticky; top:0;
    background:var(--navy); color:#fff;
    text-align:left; padding:9px 11px; font-weight:600; z-index:1;
  }
  tbody tr{background:#fff;}
  tbody td{
    padding:7px 11px;
    border-bottom:1px solid #eef1f5;
    max-width:240px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  tbody tr:hover{background:#f6f9fc;}
  tbody tr.fixed-row{background:var(--warn-bg);}
  tbody tr.fixed-row:hover{background:#f7e9c8;}
  tbody tr.anomaly-row{background:var(--danger-bg);}
  tbody tr.anomaly-row:hover{background:#f7d9d6;}
  tbody tr.info-row{background:var(--info-bg);}
  tbody tr.info-row:hover{background:#d9e8f8;}
  .tag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:999px;
    background:var(--warn);
    color:#fff;
    margin-left:5px;
    vertical-align:middle;
  }
  .tag.danger{background:var(--danger);}
  .tag.info{background:var(--info);}
  .row-count-info{font-size:12px; color:var(--text-muted);}

  .fuentes-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .fuente{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.5);
    font-size:12.5px;
  }
  .fuente .dot2{width:8px; height:8px; border-radius:50%; background:var(--text-muted); flex:none;}
  .fuente.ok .dot2{background:var(--ok);}
  .fuente.pending .dot2{background:#c7ccd4;}
  .fuente-label{font-weight:600; color:var(--navy);}
  .fuente.pending .fuente-label{color:var(--text-muted); font-weight:600;}
  .fuente-status{color:var(--text-muted);}

  .dash-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:18px;
    margin-top:16px;
  }
  .dash-col h3{
    margin:0 0 10px;
    font-size:12.5px;
    font-weight:700;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .bar-row{
    display:grid;
    grid-template-columns:1fr 80px;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
    font-size:12px;
  }
  .bar-label{
    grid-column:1;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:3px;
  }
  .bar-track{
    grid-column:1;
    height:6px;
    border-radius:999px;
    background:#eef1f5;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--blue), var(--gold));
  }
  .bar-value{
    grid-column:2;
    grid-row:1 / span 2;
    text-align:right;
    font-weight:700;
    color:var(--navy);
    font-size:12px;
  }
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important;}

  footer{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    padding:16px 0 40px;
  }
</style>
</head>
<body>

<header class="app">
  <span class="dot"></span>
  <div>
    <h1>Depurador de Excels</h1>
    <p>Contabilidad · UADE</p>
  </div>
</header>

<nav class="tabs" id="tabsNav"></nav>

<main id="panelsRoot"></main>

<footer>Herramienta interna de depuración de exportaciones · no reemplaza el archivo original</footer>

<script>
/* ---------- utilidades compartidas ---------- */
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function parseArgNumber(v){
  if (v === '' || v == null) return null;
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? null : n;
}
function dateToExcelSerial(y, m, d){
  // Días desde el epoch 1899-12-30 del sistema de fechas de Excel/SheetJS, calculado
  // con aritmética Date.UTC pura para que nunca dependa de la zona horaria del navegador.
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
}
function parseArgDate(v){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v || '');
  if (!m) return null;
  return dateToExcelSerial(+m[3], +m[2], +m[1]);
}
function sniffBinary(buf){
  const b = new Uint8Array(buf.slice(0, 8));
  const isZip = b[0] === 0x50 && b[1] === 0x4B;
  const isOle = b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0;
  return isZip ? 'xlsx' : (isOle ? 'xls' : null);
}

/* ================= módulo: Notas de Salida ================= */
function parseNotasSalida(text){
  const HEADER_ROWS_TO_SKIP = 5;
  const REQUIRED = ['NOTASALIDA', 'CODIGOPRODUCTO'];

  let lines = text.split('\r\n');
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  if (lines.length <= HEADER_ROWS_TO_SKIP){
    throw new Error('El archivo tiene muy pocas filas — no parece una exportación de Notas de Salida completa.');
  }
  const headers = lines[HEADER_ROWS_TO_SKIP].split('\t').map(h => h.trim());
  if (headers.length && headers[headers.length - 1] === '') headers.pop();
  const missing = REQUIRED.filter(h => !headers.includes(h));
  if (missing.length){
    throw new Error('No se encontró el encabezado esperado en la fila 6 (faltan columnas: ' + missing.join(', ') + '). ¿Es el archivo correcto?');
  }

  const cantidadIdx = headers.indexOf('CANTIDAD');
  const dataLines = lines.slice(HEADER_ROWS_TO_SKIP + 1).filter(l => l.trim() !== '');
  const rows = [];

  for (const line of dataLines){
    let rawFields = line.split('\t');
    if (rawFields.length > headers.length && rawFields[rawFields.length - 1] === ''){
      rawFields = rawFields.slice(0, -1);
    }

    let fixedCantidad = false, anomaly = false;
    // Tab incrustado justo antes de CANTIDAD: produce un campo vacío fantasma que corre
    // todo lo posterior una columna a la derecha. Se detecta por longitud (header+1 con
    // CANTIDAD vacío) y se corrige eliminando el campo fantasma.
    if (rawFields.length !== headers.length){
      if (rawFields.length === headers.length + 1 && cantidadIdx >= 0 && rawFields[cantidadIdx] === ''){
        rawFields = rawFields.slice(0, cantidadIdx).concat(rawFields.slice(cantidadIdx + 1));
        fixedCantidad = true;
      } else {
        anomaly = true;
      }
    }

    // Salto de línea incrustado en DESTINATARIO: se separa por \r\n, nunca por \n solo,
    // así que la fila nunca llega a partirse — el \n queda como contenido y se limpia.
    let hadNewline = false;
    const fields = rawFields.map(f => {
      if (f.indexOf('\n') !== -1 || f.indexOf('\r') !== -1){
        hadNewline = true;
        return f.replace(/[\r\n]+/g, ' ').trim();
      }
      return f.trim();
    });

    const row = {};
    headers.forEach((h, i) => { row[h] = fields[i] !== undefined ? fields[i] : ''; });
    row._id = row['NOTASALIDA'] || '(sin número)';
    row._flags = { newline: hadNewline, cantidad: fixedCantidad, anomaly: anomaly, estado: false, duplicado: false };
    rows.push(row);
  }

  // Avisos de contenido (no son bugs de parseo — datos reales, solo se señalan).
  if (headers.includes('ESTADO')){
    rows.forEach(r => { r._flags.estado = r['ESTADO'] !== 'CERRADO'; });
  }
  const dupCounts = new Map();
  rows.forEach(r => {
    const key = headers.map(h => r[h]).join('');
    dupCounts.set(key, (dupCounts.get(key) || 0) + 1);
  });
  rows.forEach(r => {
    const key = headers.map(h => r[h]).join('');
    r._flags.duplicado = dupCounts.get(key) > 1;
  });

  return {
    headers, rows,
    fixes: [
      { key: 'newline', label: 'Filas con salto de línea corregido en DESTINATARIO', col: 'DESTINATARIO', tagText: () => 'salto de línea corregido' },
      { key: 'cantidad', label: 'Filas con columna corrida corregida (desde CANTIDAD)', col: 'CANTIDAD', tagText: () => 'columna corregida' }
    ],
    avisos: [
      { key: 'estado', label: 'Filas con ESTADO distinto de CERRADO', col: 'ESTADO', tagText: r => r['ESTADO'] ? 'no cerrada' : 'sin estado' },
      { key: 'duplicado', label: 'Filas duplicadas exactas', col: 'NOTASALIDA', tagText: () => 'duplicada' }
    ]
  };
}

/* ================= módulo: Requerimientos de Gastos ================= */
function parseRequerimientosGastos(text){
  const HEADER_ROWS_TO_SKIP = 6;
  const REQUIRED = ['NUMERO', 'ESTADO', 'CODIGOPROD'];
  const CODIGOPROD_RE = /^[A-Z]{3}\d{18}$/;
  const SINO = new Set(['SI', 'NO']);

  let lines = text.split('\r\n');
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  if (lines.length <= HEADER_ROWS_TO_SKIP){
    throw new Error('El archivo tiene muy pocas filas — no parece una exportación de Requerimientos de Gastos completa.');
  }
  const headers = lines[HEADER_ROWS_TO_SKIP].split('\t').map(h => h.trim());
  if (headers.length && headers[headers.length - 1] === '') headers.pop();
  const missing = REQUIRED.filter(h => !headers.includes(h));
  if (missing.length){
    throw new Error('No se encontró el encabezado esperado en la fila 7 (faltan columnas: ' + missing.join(', ') + '). ¿Es el archivo correcto?');
  }

  const N = headers.length;
  const dataLines = lines.slice(HEADER_ROWS_TO_SKIP + 1).filter(l => l.trim() !== '');
  const rows = [];

  function buildRow(fieldsArr, flags){
    const row = {};
    headers.forEach((h, i) => { row[h] = (fieldsArr[i] !== undefined ? fieldsArr[i] : '').trim(); });
    row._id = row['NUMERO'] || '(sin número)';
    row._flags = Object.assign({ notaDetalle: false, datosProveedor: false, detalleObs: false, anomaly: false }, flags);
    return row;
  }

  for (const line of dataLines){
    let f = line.split('\t');
    if (f.length > N && f[f.length - 1] === '') f = f.slice(0, -1);

    if (f.length === N){
      rows.push(buildRow(f, {}));
      continue;
    }

    // Campos de texto libre (NOTA/DETALLE, DATOSPROVEEDOR, DETALLE_ITEM/OBSERVACIONES)
    // pueden traer tabs incrustados (pegados desde otro lado) que fragmentan la fila en
    // más columnas de las que corresponden. Se reconstruye ubicando 3 anclas confiables
    // que nunca vienen de texto libre: SINPARTIDA (SI/NO), el bloque de 3 SI/NO seguido
    // (ESCHEQUERAPIDO, COMPRAWEB, COMPRA_ALTO_MONTO) y CODIGOPROD (patrón fijo AAA######
    // ################## de 21 caracteres). Todo lo que sobra entre anclas se reabsorbe
    // en el campo de texto libre correspondiente, uniendo con espacios.
    if (f.length < 15){
      rows.push(buildRow(f, { anomaly: true }));
      continue;
    }
    const head = f.slice(0, 5);
    const tail = f.slice(-10);
    const middle = f.slice(5, f.length - 10);
    const n = middle.length;

    let ok = true;
    const spIdx = middle.findIndex(v => SINO.has(v));
    if (spIdx === -1) ok = false;

    let block3 = -1;
    if (ok){
      for (let i = spIdx + 1; i <= n - 3; i++){
        if (SINO.has(middle[i]) && SINO.has(middle[i + 1]) && SINO.has(middle[i + 2])){ block3 = i; break; }
      }
      if (block3 === -1) ok = false;
    }

    let cpIdx = -1;
    if (ok){
      for (let i = block3 + 3; i < n; i++){
        if (CODIGOPROD_RE.test(middle[i])){ cpIdx = i; break; }
      }
      if (cpIdx === -1) ok = false;
    }

    let notaDetalleBlob, origProvBlob, safe6, codigoprod, descripcionprod, itemObsBlob;
    if (ok){
      notaDetalleBlob = middle.slice(0, spIdx);
      origProvBlob = middle.slice(spIdx + 1, block3);
      safe6 = middle.slice(block3 + 3, cpIdx);
      codigoprod = middle[cpIdx];
      descripcionprod = cpIdx + 1 < n ? middle[cpIdx + 1] : '';
      itemObsBlob = middle.slice(cpIdx + 2);
      if (safe6.length !== 6) ok = false;
      if (origProvBlob.length < 3) ok = false;
    }

    if (!ok){
      rows.push(buildRow(f, { anomaly: true }));
      continue;
    }

    function collapse(blob, expected){
      if (blob.length === expected) return { vals: blob.slice(), merged: false };
      const m = blob.join(' ');
      return { vals: new Array(expected).fill(m), merged: true };
    }
    const nd = collapse(notaDetalleBlob, 2);
    const io = collapse(itemObsBlob, 2);
    let opVals, opMerged;
    if (origProvBlob.length === 3){ opVals = origProvBlob.slice(); opMerged = false; }
    else { opVals = [origProvBlob[0], origProvBlob[1], origProvBlob.slice(2).join(' ')]; opMerged = true; }

    const sinpartida = middle[spIdx];
    const esche = middle[block3], compraweb = middle[block3 + 1], altomonto = middle[block3 + 2];
    const rebuilt = head.concat(nd.vals, [sinpartida], opVals, [esche, compraweb, altomonto], safe6, [codigoprod, descripcionprod], io.vals, tail);
    rows.push(buildRow(rebuilt, { notaDetalle: nd.merged, datosProveedor: opMerged, detalleObs: io.merged }));
  }

  return {
    headers, rows,
    fixes: [
      { key: 'notaDetalle', label: 'Filas con NOTA/DETALLE recompuesto (tab incrustado)', col: 'NOTA', tagText: () => 'texto recompuesto' },
      { key: 'datosProveedor', label: 'Filas con DATOSPROVEEDOR recompuesto', col: 'DATOSPROVEEDOR', tagText: () => 'texto recompuesto' },
      { key: 'detalleObs', label: 'Filas con DETALLE_ITEM / OBSERVACIONES recompuesto', col: 'DETALLE_ITEM', tagText: () => 'texto recompuesto' }
    ],
    avisos: []
  };
}

/* ================= módulo: Requerimiento de Compra ================= */
function parseRequerimientoCompra(text){
  const HEADER_ROWS_TO_SKIP = 6;
  const REQUIRED = ['NUM', 'ESTADO', 'CODPROD'];
  const CODPROD_RE = /^[A-Z]{3}\d+$/;
  const SINO = new Set(['SI', 'NO']);

  let lines = text.split('\r\n');
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  if (lines.length <= HEADER_ROWS_TO_SKIP){
    throw new Error('El archivo tiene muy pocas filas — no parece una exportación de Requerimiento de Compra completa.');
  }
  const headers = lines[HEADER_ROWS_TO_SKIP].split('\t').map(h => h.trim());
  if (headers.length && headers[headers.length - 1] === '') headers.pop();
  const missing = REQUIRED.filter(h => !headers.includes(h));
  if (missing.length){
    throw new Error('No se encontró el encabezado esperado en la fila 7 (faltan columnas: ' + missing.join(', ') + '). ¿Es el archivo correcto?');
  }

  const N = headers.length;
  const dataLines = lines.slice(HEADER_ROWS_TO_SKIP + 1).filter(l => l.trim() !== '');
  const rows = [];

  function buildRow(fieldsArr, flags){
    const row = {};
    headers.forEach((h, i) => { row[h] = (fieldsArr[i] !== undefined ? fieldsArr[i] : '').trim(); });
    row._id = row['NUM'] || '(sin número)';
    row._flags = Object.assign({ detalle: false, detalleObs: false, motivo: false, obsFast: false, anomaly: false }, flags);
    return row;
  }

  function collapse(blob, expected){
    if (blob.length === expected) return { vals: blob.slice(), merged: false };
    const m = blob.join(' ');
    return { vals: new Array(expected).fill(m), merged: true };
  }

  for (const line of dataLines){
    let f = line.split('\t');
    if (f.length > N && f[f.length - 1] === '') f = f.slice(0, -1);

    if (f.length === N){
      rows.push(buildRow(f, {}));
      continue;
    }

    // Igual que en Requerimientos de Gastos: varios campos de texto libre pueden traer
    // tabs incrustados. Acá hay más de un tramo de riesgo (DETALLE cerca del inicio,
    // DETALLEITEM/OBS más adelante, MOTIVO y OBSERFASTTRACK después), así que se ubican
    // anclas confiables en cadena: SINPARTIDA (SI/NO), el patrón fijo de CODPROD, y dos
    // pares "espejo" (CC_CABECERA/DESC_CC deben repetirse literalmente en COD_CCITEM/
    // NOM_CCITEM, y CODACT_CABE/DESCACT_CABE en CODIGO_CODACTITEM/NOM_CODACTITEM) que
    // sirven de anclas exactas por valor, no solo por forma. Lo que sobra entre anclas
    // se reabsorbe en el campo de texto libre correspondiente.
    if (f.length < 20){
      rows.push(buildRow(f, { anomaly: true }));
      continue;
    }
    const n = f.length;
    const head = f.slice(0, 4);

    let ok = true;
    const sp = f.slice(4).findIndex(v => SINO.has(v));
    const spIdx = sp === -1 ? -1 : sp + 4;
    if (spIdx === -1) ok = false;

    let cpIdx = -1;
    if (ok){
      for (let i = spIdx + 1; i < n; i++){
        if (CODPROD_RE.test(f[i])){ cpIdx = i; break; }
      }
      if (cpIdx === -1) ok = false;
    }

    let segB, origin, codtipocomp, nomtipocom, codact_cabe, descact_cabe, cc_cabecera, desc_cc, estado, linea;
    if (ok){
      segB = f.slice(spIdx + 1, cpIdx);
      if (segB.length !== 9){ ok = false; }
      else{
        [origin, codtipocomp, nomtipocom, codact_cabe, descact_cabe, cc_cabecera, desc_cc, estado, linea] = segB;
      }
    }

    let codalternativo, descprod;
    if (ok){
      if (cpIdx + 2 >= n){ ok = false; }
      else{ codalternativo = f[cpIdx + 1]; descprod = f[cpIdx + 2]; }
    }

    let mirrorIdx = -1;
    if (ok){
      for (let i = cpIdx + 3; i < n - 1; i++){
        if (f[i] === cc_cabecera && f[i + 1] === desc_cc){ mirrorIdx = i; break; }
      }
      if (mirrorIdx === -1) ok = false;
    }

    let detalleitem, obs, um, imp_total, cantidad, imp_unit, fechavenc, blob1Merged = false;
    if (ok){
      const blob1 = f.slice(cpIdx + 3, mirrorIdx);
      if (blob1.length === 7){
        [detalleitem, obs, um, imp_total, cantidad, imp_unit, fechavenc] = blob1;
      } else if (blob1.length > 7){
        const tailPart = blob1.slice(-5);
        const headPart = blob1.slice(0, blob1.length - 5);
        [um, imp_total, cantidad, imp_unit, fechavenc] = tailPart;
        const c = collapse(headPart, 2);
        [detalleitem, obs] = c.vals;
        blob1Merged = true;
      } else { ok = false; }
    }

    let codigo_codactitem, nom_codactitem, autorizacion;
    if (ok){
      if (mirrorIdx + 4 >= n){ ok = false; }
      else{
        codigo_codactitem = f[mirrorIdx + 2];
        nom_codactitem = f[mirrorIdx + 3];
        if (codigo_codactitem !== codact_cabe || nom_codactitem !== descact_cabe){ ok = false; }
        else{ autorizacion = f[mirrorIdx + 4]; }
      }
    }

    let ftIdx = -1;
    if (ok){
      for (let i = mirrorIdx + 5; i < n; i++){ if (SINO.has(f[i])){ ftIdx = i; break; } }
      if (ftIdx === -1) ok = false;
    }

    let motivo, motivoMerged = false;
    if (ok){
      const motivoBlob = f.slice(mirrorIdx + 5, ftIdx);
      if (motivoBlob.length === 1){ motivo = motivoBlob[0]; }
      else if (motivoBlob.length > 1){ motivo = motivoBlob.join(' '); motivoMerged = true; }
      else { ok = false; }
    }

    let siIdx = -1;
    if (ok){
      for (let i = ftIdx + 1; i < n; i++){ if (SINO.has(f[i])){ siIdx = i; break; } }
      if (siIdx === -1) ok = false;
    }

    let obsFast, libFields, cuenta, descripcion, valortotal, blob2Merged = false;
    if (ok){
      const blob2 = f.slice(ftIdx + 1, siIdx);
      if (blob2.length === 12){
        obsFast = blob2[0];
        libFields = blob2.slice(1, 9);
        [cuenta, descripcion, valortotal] = blob2.slice(9, 12);
      } else if (blob2.length > 12){
        const tailPart = blob2.slice(-11);
        const headPart = blob2.slice(0, blob2.length - 11);
        libFields = tailPart.slice(0, 8);
        [cuenta, descripcion, valortotal] = tailPart.slice(8, 11);
        obsFast = headPart.join(' ');
        blob2Merged = true;
      } else { ok = false; }
    }

    let fecha_imputacion;
    if (ok){
      if (siIdx + 1 >= n){ ok = false; }
      else{ fecha_imputacion = f[siIdx + 1]; }
    }

    if (!ok){
      rows.push(buildRow(f, { anomaly: true }));
      continue;
    }

    const detalleBlobRaw = f.slice(4, spIdx);
    const dCollapse = collapse(detalleBlobRaw, 1);
    const detalle = dCollapse.vals[0];

    const rebuilt = head.concat(
      [detalle, f[spIdx], origin, codtipocomp, nomtipocom, codact_cabe, descact_cabe, cc_cabecera, desc_cc, estado, linea],
      [f[cpIdx], codalternativo, descprod, detalleitem, obs, um, imp_total, cantidad, imp_unit, fechavenc],
      [cc_cabecera, desc_cc, codigo_codactitem, nom_codactitem, autorizacion, motivo, f[ftIdx]],
      [obsFast], libFields, [cuenta, descripcion, valortotal],
      [f[siIdx], fecha_imputacion]
    );
    rows.push(buildRow(rebuilt, {
      detalle: dCollapse.merged,
      detalleObs: blob1Merged,
      motivo: motivoMerged,
      obsFast: blob2Merged
    }));
  }

  return {
    headers, rows,
    fixes: [
      { key: 'detalle', label: 'Filas con DETALLE recompuesto (tab incrustado)', col: 'DETALLE', tagText: () => 'texto recompuesto' },
      { key: 'detalleObs', label: 'Filas con DETALLEITEM / OBS recompuesto', col: 'DETALLEITEM', tagText: () => 'texto recompuesto' },
      { key: 'motivo', label: 'Filas con MOTIVO recompuesto', col: 'MOTIVO', tagText: () => 'texto recompuesto' },
      { key: 'obsFast', label: 'Filas con OBSERFASTTRACK recompuesto', col: 'OBSERFASTTRACK', tagText: () => 'texto recompuesto' }
    ],
    avisos: []
  };
}

MODULES.forEach(m => { m.state = { parsed: null, sourceName: '' }; });

const ROLLUP_TAB = { id: 'resumen', tabLabel: 'Resumen General', isRollup: true };
const TABS = MODULES.concat([ROLLUP_TAB]);

function buildShell(){
  const tabsNav = document.getElementById('tabsNav');
  const tabsInner = document.createElement('div');
  tabsInner.className = 'inner';
  tabsNav.appendChild(tabsInner);
  const panelsRoot = document.getElementById('panelsRoot');

  TABS.forEach((mod, i) => {
    const btn = document.createElement('button');
    btn.textContent = mod.tabLabel;
    btn.className = i === 0 ? 'active' : '';
    btn.addEventListener('click', () => activateTab(mod.id));
    btn.id = 'tabbtn-' + mod.id;
    tabsInner.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + mod.id;

    if (mod.isRollup){
      panel.innerHTML = `
        <div class="card">
          <h2>Fuentes</h2>
          <p class="sub">Junta lo que ya depuraste en los otros módulos — no hace falta volver a subir nada acá.</p>

          <h2>Dashboard</h2>
          <div class="stat-row" id="resumen-statRow"></div>

          <div class="dash-grid">
            <div class="dash-col">
              <h3>Por módulo</h3>
              <div id="resumen-porModulo"></div>
            </div>
            <div class="dash-col">
              <h3>Top centros de costo</h3>
              <div id="resumen-porCentro"></div>
            </div>
            <div class="dash-col">
              <h3>Top personas</h3>
              <div id="resumen-porPersona"></div>
            </div>
          </div>

          <div class="toolbar" style="justify-content:flex-end">
            <button class="btn" id="resumen-downloadBtn">⬇ Descargar Excel consolidado (multi-hoja)</button>
          </div>
        </div>
      `;
      panelsRoot.appendChild(panel);
      document.getElementById('resumen-downloadBtn').addEventListener('click', downloadConsolidado);
      return;
    }

    panel.innerHTML = `
      <div class="card">
        <h2>Subir archivo</h2>
        <div class="dropzone" id="${mod.id}-dropzone">
          <div class="icon">📄</div>
          <div class="main-txt">Arrastrá el archivo acá o hacé clic para elegirlo</div>
          <div class="sub-txt">${escapeHtml(mod.fileHint)}</div>
          <input type="file" id="${mod.id}-fileInput" accept="${mod.accept}">
        </div>
        <div class="err-box" id="${mod.id}-error"></div>
      </div>

      <div class="card results" id="${mod.id}-results">
        <h2>Resultado</h2>
        <p class="sub" id="${mod.id}-fileName"></p>
        <div class="stat-row" id="${mod.id}-statRow"></div>
        <div id="${mod.id}-healthWrap"></div>
        <div id="${mod.id}-detailsWrap"></div>

        <div class="toolbar">
          <div class="left">
            <input type="text" class="search-input" id="${mod.id}-search" placeholder="Buscar en cualquier columna…">
            <label class="chk"><input type="checkbox" id="${mod.id}-onlyFixed"> Ver solo filas para revisar</label>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="row-count-info" id="${mod.id}-rowCountInfo"></span>
            <button class="btn" id="${mod.id}-downloadBtn">⬇ Descargar Excel depurado</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr id="${mod.id}-theadRow"></tr></thead>
            <tbody id="${mod.id}-tbody"></tbody>
          </table>
        </div>
      </div>
    `;
    panelsRoot.appendChild(panel);

    wireModule(mod);
  });

  renderRollup();
}

function activateTab(id){
  TABS.forEach(m => {
    document.getElementById('tabbtn-' + m.id).classList.toggle('active', m.id === id);
    document.getElementById('panel-' + m.id).classList.toggle('active', m.id === id);
  });
  if (id === 'resumen') renderRollup();
}

function wireModule(mod){
  const dropzone = document.getElementById(mod.id + '-dropzone');
  const fileInput = document.getElementById(mod.id + '-fileInput');

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(mod, e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files.length) handleFile(mod, e.target.files[0]);
  });

  document.getElementById(mod.id + '-search').addEventListener('input', () => renderTableBody(mod));
  document.getElementById(mod.id + '-onlyFixed').addEventListener('change', () => renderTableBody(mod));
  document.getElementById(mod.id + '-downloadBtn').addEventListener('click', () => downloadCleaned(mod));
}

async function handleFile(mod, file){
  const errBox = document.getElementById(mod.id + '-error');
  errBox.style.display = 'none';
  mod.state.sourceName = file.name;

  const buf = await file.arrayBuffer();
  const binaryKind = sniffBinary(buf);
  if (binaryKind){
    errBox.textContent = 'Este archivo es un Excel binario real (.' + binaryKind + '). Esta herramienta espera el archivo de texto tal cual lo entrega el sistema (el .xls que en realidad es texto separado por tabs). Subí ese archivo directamente, sin abrirlo/guardarlo antes en Excel.';
    errBox.style.display = 'block';
    document.getElementById(mod.id + '-results').style.display = 'none';
    return;
  }

  const text = new TextDecoder('windows-1252').decode(buf);
  try{
    mod.state.parsed = mod.parseFn(text);
  }catch(err){
    errBox.textContent = err.message;
    errBox.style.display = 'block';
    document.getElementById(mod.id + '-results').style.display = 'none';
    return;
  }
  renderModule(mod);
}

function renderModule(mod){
  const P = mod.state.parsed;
  const { headers, rows, fixes, avisos } = P;

  document.getElementById(mod.id + '-results').style.display = 'block';
  document.getElementById(mod.id + '-fileName').textContent = 'Archivo: ' + mod.state.sourceName;

  const anomalyCount = rows.filter(r => r._flags.anomaly).length;
  const fixedCount = rows.filter(r => !r._flags.anomaly && fixes.some(f => r._flags[f.key])).length;
  const avisoCount = rows.filter(r => !r._flags.anomaly && !fixes.some(f => r._flags[f.key]) && avisos.some(a => r._flags[a.key])).length;
  const cleanCount = rows.length - anomalyCount - fixedCount - avisoCount;

  const statRow = document.getElementById(mod.id + '-statRow');
  let statHtml = `
    <div class="stat"><div class="n">${rows.length.toLocaleString('es-AR')}</div><div class="l">Filas de datos</div></div>
    <div class="stat"><div class="n">${headers.length}</div><div class="l">Columnas</div></div>`;
  fixes.forEach(f => {
    const c = rows.filter(r => r._flags[f.key]).length;
    statHtml += `<div class="stat fixed"><div class="n">${c}</div><div class="l">${escapeHtml(f.label)}</div></div>`;
  });
  avisos.forEach(a => {
    const c = rows.filter(r => r._flags[a.key]).length;
    statHtml += `<div class="stat aviso"><div class="n">${c}</div><div class="l">${escapeHtml(a.label)}</div></div>`;
  });
  if (anomalyCount > 0){
    statHtml += `<div class="stat anomaly"><div class="n">${anomalyCount}</div><div class="l">Filas con un problema no reconocido</div></div>`;
  }
  statRow.innerHTML = statHtml;

  const segs = [
    { n: cleanCount, cls: 'seg-ok', label: 'Limpias' },
    { n: fixedCount, cls: 'seg-warn', label: 'Corregidas' },
    { n: avisoCount, cls: 'seg-info', label: 'Avisos' },
    { n: anomalyCount, cls: 'seg-danger', label: 'Revisar' }
  ].filter(s => s.n > 0);
  const total = rows.length || 1;
  const bars = segs.map(s => `<div class="health-seg ${s.cls}" style="width:${(s.n / total * 100).toFixed(2)}%" title="${s.label}: ${s.n}"></div>`).join('');
  const legend = segs.map(s => `<span><i class="${s.cls}"></i>${s.label} ${s.n}</span>`).join('');
  document.getElementById(mod.id + '-healthWrap').innerHTML = `<div class="health-bar">${bars}</div><div class="health-legend">${legend}</div>`;

  let detailsHtml = '';
  fixes.forEach(f => {
    const ids = rows.filter(r => r._flags[f.key]).map(r => r._id);
    if (ids.length){
      detailsHtml += `<details class="aviso-details fixed"><summary>${escapeHtml(f.label)} (${ids.length})</summary><div class="ids">${ids.map(escapeHtml).join(', ')}</div></details>`;
    }
  });
  avisos.forEach(a => {
    const ids = rows.filter(r => r._flags[a.key]).map(r => r._id);
    if (ids.length){
      detailsHtml += `<details class="aviso-details aviso"><summary>${escapeHtml(a.label)} (${ids.length})</summary><div class="ids">${ids.map(escapeHtml).join(', ')}</div></details>`;
    }
  });
  if (anomalyCount > 0){
    const ids = rows.filter(r => r._flags.anomaly).map(r => r._id);
    detailsHtml += `<details class="aviso-details anomaly"><summary>⚠ Con un problema no reconocido, sin modificar (${ids.length})</summary><div class="ids">${ids.map(escapeHtml).join(', ')}</div></details>`;
  }
  document.getElementById(mod.id + '-detailsWrap').innerHTML = detailsHtml;

  document.getElementById(mod.id + '-theadRow').innerHTML = headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('');
  renderTableBody(mod);
}

function renderTableBody(mod){
  const P = mod.state.parsed;
  const { headers, rows, fixes, avisos } = P;
  const search = document.getElementById(mod.id + '-search').value.trim().toLowerCase();
  const onlyFixed = document.getElementById(mod.id + '-onlyFixed').checked;

  let filtered = rows;
  if (onlyFixed){
    filtered = filtered.filter(r => r._flags.anomaly || fixes.some(f => r._flags[f.key]) || avisos.some(a => r._flags[a.key]));
  }
  if (search){
    filtered = filtered.filter(r => headers.some(h => (r[h] || '').toLowerCase().includes(search)));
  }

  const tbody = document.getElementById(mod.id + '-tbody');
  const MAX_RENDER = 1000;
  const toRender = filtered.slice(0, MAX_RENDER);

  const colTags = {}; // colIndex -> [{key, tagText, cls}]
  function addTag(colName, tagText, cls){
    const idx = headers.indexOf(colName);
    if (idx < 0) return;
    (colTags[idx] = colTags[idx] || []).push({ tagText, cls });
  }

  tbody.innerHTML = toRender.map(r => {
    let cls = '';
    if (r._flags.anomaly) cls = ' class="anomaly-row"';
    else if (fixes.some(f => r._flags[f.key])) cls = ' class="fixed-row"';
    else if (avisos.some(a => r._flags[a.key])) cls = ' class="info-row"';

    const cells = headers.map((h, i) => {
      let val = escapeHtml(r[h] || '');
      fixes.forEach(f => {
        if (h === f.col && r._flags[f.key]) val += `<span class="tag">${escapeHtml(f.tagText(r))}</span>`;
      });
      avisos.forEach(a => {
        if (h === a.col && r._flags[a.key]) val += `<span class="tag info">${escapeHtml(a.tagText(r))}</span>`;
      });
      if (i === 0 && r._flags.anomaly) val += '<span class="tag danger">revisar</span>';
      return '<td>' + val + '</td>';
    }).join('');
    return '<tr' + cls + '>' + cells + '</tr>';
  }).join('');

  const info = document.getElementById(mod.id + '-rowCountInfo');
  if (filtered.length > MAX_RENDER){
    info.textContent = 'Mostrando ' + MAX_RENDER.toLocaleString('es-AR') + ' de ' + filtered.length.toLocaleString('es-AR') + ' filas';
  }else{
    info.textContent = filtered.length.toLocaleString('es-AR') + ' filas';
  }
}

function buildModuleSheet(mod){
  const { headers, rows } = mod.state.parsed;
  const dateColIdx = new Set(headers.map((h, i) => mod.dateCols.has(h) ? i : -1).filter(i => i >= 0));
  const aoa = [headers];
  rows.forEach(r => {
    const line = headers.map(h => {
      const v = r[h] || '';
      if (mod.numericCols.has(h)) return parseArgNumber(v);
      if (mod.dateCols.has(h)){ const s = parseArgDate(v); return s === null ? v : s; }
      return v;
    });
    aoa.push(line);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let r = 1; r < aoa.length; r++){
    dateColIdx.forEach(c => {
      const ref = XLSX.utils.encode_cell({ r, c });
      const cell = ws[ref];
      if (cell && cell.t === 'n') cell.z = 'dd/mm/yyyy';
    });
  }
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: headers.length - 1 } }) };
  ws['!cols'] = headers.map(h => ({ wch: Math.min(Math.max(h.length, 12), 40) }));
  return ws;
}

function downloadCleaned(mod){
  if (!mod.state.parsed) return;
  const ws = buildModuleSheet(mod);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, mod.sheetName);

  const stamp = new Date().toISOString().slice(0, 10);
  const baseName = (mod.state.sourceName || mod.fileBase).replace(/\.[^.]+$/, '');
  XLSX.writeFile(wb, baseName + '_depurado_' + stamp + '.xlsx');
}

/* ================= módulo 5: Resumen General (rejunte + dashboard) ================= */
const ROLLUP_SOURCE_IDS = ['ns', 'rg', 'rc']; // 'comprometidos' se suma acá cuando exista
const TOP_N = 8;

function fmtMoney(n){
  return '$' + n.toLocaleString('es-AR', { maximumFractionDigits: 0 });
}

function computeRollup(){
  const sources = ROLLUP_SOURCE_IDS.map(id => MODULES.find(m => m.id === id)).filter(Boolean);
  const loaded = sources.filter(m => m.state.parsed);
  const missing = sources.filter(m => !m.state.parsed);

  const centroTotals = new Map();
  const personaTotals = new Map();
  const moduloTotals = [];
  let totalImporte = 0, totalFilas = 0, filasExcluidas = 0;

  loaded.forEach(mod => {
    const map = mod.dashboardMap;
    const { rows } = mod.state.parsed;
    let modImporte = 0, modFilas = 0;
    rows.forEach(r => {
      totalFilas++;
      if (r._flags && r._flags.anomaly){ filasExcluidas++; return; } // no confiar en datos sin reconstruir
      const importe = parseArgNumber(r[map.amountCol]) || 0;
      const centro = (r[map.centroCol] || '(sin centro de costo)').trim() || '(sin centro de costo)';
      const persona = (r[map.personaCol] || '(sin identificar)').trim() || '(sin identificar)';

      modImporte += importe;
      modFilas++;
      totalImporte += importe;

      const c = centroTotals.get(centro) || { total: 0, count: 0 };
      c.total += importe; c.count++;
      centroTotals.set(centro, c);

      const p = personaTotals.get(persona) || { total: 0, count: 0 };
      p.total += importe; p.count++;
      personaTotals.set(persona, p);
    });
    moduloTotals.push({ id: mod.id, label: mod.tabLabel, total: modImporte, count: modFilas });
  });

  const topCentros = Array.from(centroTotals, ([name, v]) => ({ name, ...v })).sort((a, b) => b.total - a.total);
  const topPersonas = Array.from(personaTotals, ([name, v]) => ({ name, ...v })).sort((a, b) => b.total - a.total);

  return { loaded, missing, totalImporte, totalFilas, filasExcluidas, moduloTotals, topCentros, topPersonas };
}

function barListHtml(items){
  const max = items.length ? items[0].total : 0;
  return items.slice(0, TOP_N).map(it => `
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${max ? (it.total / max * 100).toFixed(1) : 0}%"></div></div>
      <div class="bar-value">${fmtMoney(it.total)}</div>
    </div>
  `).join('') || '<p class="sub">Sin datos todavía.</p>';
}

function renderRollup(){
  const R = computeRollup();
  const allSources = ROLLUP_SOURCE_IDS.map(id => MODULES.find(m => m.id === id)).filter(Boolean);

  const fuentesHtml = allSources.map(mod => {
    const ok = !!mod.state.parsed;
    const n = ok ? mod.state.parsed.rows.length.toLocaleString('es-AR') : null;
    return `<div class="fuente ${ok ? 'ok' : 'pending'}">
      <span class="dot2"></span>
      <span class="fuente-label">${escapeHtml(mod.tabLabel)}</span>
      <span class="fuente-status">${ok ? n + ' filas' : 'sin cargar'}</span>
    </div>`;
  }).join('') + `<div class="fuente pending"><span class="dot2"></span><span class="fuente-label">Comprometidos</span><span class="fuente-status">módulo pendiente</span></div>`;
  document.getElementById('resumen-fuentes').innerHTML = fuentesHtml;

  document.getElementById('resumen-statRow').innerHTML = `
    <div class="stat"><div class="n">${fmtMoney(R.totalImporte)}</div><div class="l">Importe total (módulos cargados)</div></div>
    <div class="stat"><div class="n">${R.totalFilas.toLocaleString('es-AR')}</div><div class="l">Filas totales</div></div>
    <div class="stat"><div class="n">${R.loaded.length}/${ROLLUP_SOURCE_IDS.length + 1}</div><div class="l">Módulos con datos cargados</div></div>
    ${R.filasExcluidas ? `<div class="stat anomaly"><div class="n">${R.filasExcluidas}</div><div class="l">Filas excluidas del cálculo (anomalías sin reconstruir)</div></div>` : ''}
  `;

  document.getElementById('resumen-porModulo').innerHTML = R.moduloTotals.length
    ? barListHtml(R.moduloTotals.map(m => ({ name: m.label, total: m.total })))
    : '<p class="sub">Cargá al menos un módulo para ver el desglose.</p>';

  document.getElementById('resumen-porCentro').innerHTML = barListHtml(R.topCentros);
  document.getElementById('resumen-porPersona').innerHTML = barListHtml(R.topPersonas);

  const btn = document.getElementById('resumen-downloadBtn');
  btn.disabled = R.loaded.length === 0;
}

function downloadConsolidado(){
  const sources = ROLLUP_SOURCE_IDS.map(id => MODULES.find(m => m.id === id)).filter(Boolean);
  const loaded = sources.filter(m => m.state.parsed);
  if (!loaded.length) return;

  const wb = XLSX.utils.book_new();

  const R = computeRollup();
  const resumenAoa = [
    ['Resumen general — generado ' + new Date().toLocaleString('es-AR')],
    [],
    ['Importe total', R.totalImporte],
    ['Filas totales', R.totalFilas],
    ['Filas excluidas (anomalías sin reconstruir)', R.filasExcluidas],
    [],
    ['Por módulo'],
    ['Módulo', 'Importe', 'Filas'],
    ...R.moduloTotals.map(m => [m.label, m.total, m.count]),
    [],
    ['Por centro de costo'],
    ['Centro de costo', 'Importe', 'Filas'],
    ...R.topCentros.map(c => [c.name, c.total, c.count]),
    [],
    ['Por persona'],
    ['Persona', 'Importe', 'Filas'],
    ...R.topPersonas.map(p => [p.name, p.total, p.count])
  ];
  const resumenWs = XLSX.utils.aoa_to_sheet(resumenAoa);
  resumenWs['!cols'] = [{ wch: 42 }, { wch: 16 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, resumenWs, 'Resumen');

  loaded.forEach(mod => {
    const ws = buildModuleSheet(mod);
    let name = mod.sheetName;
    if (name.length > 31) name = name.slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });

  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, 'resumen_consolidado_' + stamp + '.xlsx');
}
